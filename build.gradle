buildscript {
    repositories {
        google()
        mavenLocal()
        mavenCentral()
    }
    dependencies {
        classpath libs.gradle
        classpath libs.kotlin.gradle.plugin
        // Maven Central Publish (Central Portal)
        classpath libs.vanniktech.maven.publish
    }
}

allprojects {
    repositories {
        google()
        mavenLocal()
        mavenCentral()
    }
}

allprojects {
    plugins.withId("com.vanniktech.maven.publish") {
        mavenPublishing {
            // Sonatype Central Portal (OSSRH was shut down in 2025).
            publishToMavenCentral()
            // Signing is mandatory on Maven Central; local builds publish unsigned.
            if (project.hasProperty("signingInMemoryKey") || project.hasProperty("signing.keyId")) {
                signAllPublications()
            }
        }
    }
}

tasks.register('printProjectProperties') {
    project.properties.each { println "   $it" }
}
